  footer { color:var(--muted); text-align:center; margin-top:24px; font-size:13px; }

/* UI */
const appEl = document.getElementById("app");
const progressText = document.getElementById("progressText");
const barFill = document.getElementById("barFill");

function showStatus(message, type = "info") {
  let el = document.getElementById("firebaseStatus");
  if (!el) {
    el = document.createElement("div");
    el.id = "firebaseStatus";
    el.style.cssText =
      "margin:14px 0;padding:12px 14px;border-radius:12px;font-weight:700;" +
      "background:#eef2ff;color:#27357a;";
    document.querySelector(".actions").insertAdjacentElement("afterend", el);
  }
  el.textContent = message;
  el.style.background = type === "error" ? "#fef2f2" : "#eef2ff";
  el.style.color = type === "error" ? "#b91c1c" : "#27357a";
}

function getDisplayName(email) {
  return USERS[email] || email || "사용자";
}

function renderAuthHeader() {
  let box = document.getElementById("authBox");
  if (!box) {
    box = document.createElement("div");
    box.id = "authBox";
    box.style.cssText =
      "margin-top:14px;display:flex;align-items:center;justify-content:space-between;" +
      "gap:12px;flex-wrap:wrap;";
    document.querySelector("header").appendChild(box);
  }

  if (!currentUser) {
    box.innerHTML = `
      <button id="googleLoginBtn"
        style="border:0;background:#fff;color:#1f2937;padding:11px 16px;border-radius:10px;
        font-weight:800;cursor:pointer;">
        🔐 Google 계정으로 로그인
      </button>
      <span style="font-size:13px;opacity:.9;">재환 · 혜리 전용</span>
    `;
    document.getElementById("googleLoginBtn").onclick = async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error(error);
        showStatus(`로그인 실패: ${error.message}`, "error");
      }
    };
  } else {
    const name = getDisplayName(currentUser.email);
    box.innerHTML = `
      <div style="font-size:14px;">
        <strong>👤 ${name}</strong>
        <span style="opacity:.8;"> · ${currentUser.email}</span>
      </div>
      <button id="logoutBtn"
        style="border:1px solid #ffffff66;background:#ffffff22;color:#fff;
        padding:9px 13px;border-radius:10px;font-weight:700;cursor:pointer;">
        로그아웃
      </button>
    `;
    document.getElementById("logoutBtn").onclick = () => signOut(auth);
  }
}

function flattenItems(items, result = []) {
  items.forEach(item => {
    if (Array.isArray(item[1])) {
      flattenItems(item[1], result);
    } else {
      result.push(item[0]);
    }
  });
  return result;
}

const itemLabels = flattenItems(data);
const itemKeys = itemLabels.map((_, i) => String(i));

function render() {
  appEl.innerHTML = "";
  totalItems = 0;
  let index = 0;

  data.forEach(section => {
    const sec = document.createElement("section");
    const h2 = document.createElement("h2");
    h2.textContent = section[0];
    sec.appendChild(h2);

    function renderItems(items, parent) {
      items.forEach(item => {
        if (Array.isArray(item[1])) {
          const h3 = document.createElement("h3");
          h3.textContent = item[0];
          parent.appendChild(h3);
          renderItems(item[1], parent);
        } else {
          const key = String(index++);
          totalItems++;

          const label = document.createElement("label");
          label.dataset.key = key;

          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = !!state[key];
          cb.disabled = !currentUser;

          const content = document.createElement("span");
          content.style.flex = "1";

          const text = document.createElement("span");
          text.textContent = item[0];
          content.appendChild(text);

          const who = checkedBy[key];
          if (state[key] && who) {
            const badge = document.createElement("small");
            badge.textContent = `  · ${who}`;
            badge.style.cssText =
              "display:inline-block;margin-left:6px;color:#315efb;font-weight:800;font-size:12px;";
            content.appendChild(badge);
          }

          label.append(cb, content);
          if (cb.checked) label.classList.add("done");

          cb.addEventListener("change", () => toggleItem(key, cb.checked));
          parent.appendChild(label);
        }
      });
    }

    renderItems(section[1], sec);
    appEl.appendChild(sec);
  });

  updateProgress();
}

async function toggleItem(key, checked) {
  if (!currentUser || isSyncing) return;

  state[key] = checked;
  if (checked) {
    checkedBy[key] = getDisplayName(currentUser.email);
  } else {
    delete checkedBy[key];
  }

  render();

  try {
    await setDoc(checklistRef, {
      state,
      checkedBy,
      updatedAt: new Date().toISOString(),
      updatedBy: getDisplayName(currentUser.email)
    }, { merge: true });
    showStatus(`☁️ 저장됨 · ${getDisplayName(currentUser.email)}`);
  } catch (error) {
    console.error(error);
    showStatus(`저장 실패: ${error.message}`, "error");
  }
}

function updateProgress() {
  const done = Object.values(state).filter(Boolean).length;
  const pct = totalItems ? Math.round(done / totalItems * 100) : 0;
  progressText.textContent = `${done} / ${totalItems} (${pct}%)`;
  barFill.style.width = pct + "%";
}

async function loadChecklist() {
  if (unsubscribeChecklist) {
    unsubscribeChecklist();
    unsubscribeChecklist = null;
  }

  if (!currentUser) {
    state = {};
    checkedBy = {};
    render();
    showStatus("🔒 로그인하면 체크 상태를 공유할 수 있습니다.");
    return;
  }

  unsubscribeChecklist = onSnapshot(
    checklistRef,
    snapshot => {
      isSyncing = true;
      if (snapshot.exists()) {
        const data = snapshot.data();
        state = data.state || {};
        checkedBy = data.checkedBy || {};
      } else {
        state = {};
        checkedBy = {};
      }
      render();
      isSyncing = false;
      showStatus(`☁️ 실시간 동기화 중 · ${getDisplayName(currentUser.email)}`);
    },
    error => {
      console.error(error);
      isSyncing = false;
      showStatus(`Firestore 연결 실패: ${error.message}`, "error");
    }
  );
}

function setActionButtonsEnabled(enabled) {
  ["uncheckAllBtn", "checkAllBtn"].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.disabled = !enabled;
  });
}

async function checkAll() {
  if (!currentUser) return;
  const name = getDisplayName(currentUser.email);
  const nextState = {};
  const nextBy = {};

  for (let i = 0; i < totalItems; i++) {
    nextState[String(i)] = true;
    nextBy[String(i)] = name;
  }

  try {
    await setDoc(checklistRef, {
      state: nextState,
      checkedBy: nextBy,
      updatedAt: new Date().toISOString(),
      updatedBy: name
    }, { merge: true });
  } catch (error) {
    console.error(error);
    showStatus(`저장 실패: ${error.message}`, "error");
  }
}

async function uncheckAll() {
  if (!currentUser) return;
  if (!confirm("모든 체크를 해제할까요? 재환/혜리 모두의 체크 상태가 초기화됩니다.")) return;

  try {
    await setDoc(checklistRef, {
      state: {},
      checkedBy: {},
      updatedAt: new Date().toISOString(),
      updatedBy: getDisplayName(currentUser.email)
    }, { merge: true });
  } catch (error) {
    console.error(error);
    showStatus(`저장 실패: ${error.message}`, "error");
  }
}

function clearSaved() {
  alert("Firebase 버전에서는 브라우저의 저장 데이터 초기화를 사용하지 않습니다.\n공유 체크 상태를 초기화하려면 '전체 미완료'를 사용하세요.");
}

document.querySelector(".actions").innerHTML = `
  <button id="uncheckAllBtn">전체 미완료</button>
  <button id="checkAllBtn">전체 완료</button>
  <button id="clearSavedBtn">로컬 저장 데이터 안내</button>
`;
document.getElementById("uncheckAllBtn").onclick = uncheckAll;
document.getElementById("checkAllBtn").onclick = checkAll;
document.getElementById("clearSavedBtn").onclick = clearSaved;

onAuthStateChanged(auth, async user => {
  currentUser = user;
  renderAuthHeader();

  if (user && !USERS[user.email]) {
    await signOut(auth);
    showStatus("⛔ 이 여행 페이지는 재환과 혜리 계정만 사용할 수 있습니다.", "error");
    return;
  }

  if (user) {
    showStatus(`☁️ ${getDisplayName(user.email)}님 로그인 완료`);
  }

  await loadChecklist();
});

renderAuthHeader();
render();
</script>
